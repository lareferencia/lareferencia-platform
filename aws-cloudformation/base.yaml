AWSTemplateFormatVersion: '2010-09-09'
Description: LA Referencia shared existing network and Headscale/Headplane control plane.

Parameters:
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
  ExistingWorkloadSubnetId:
    Type: AWS::EC2::Subnet::Id
  ExistingWorkloadSubnetCidr:
    Type: String
    Default: 172.31.80.0/20
  HostedZoneId:
    Type: String
  HeadscaleHostname:
    Type: String
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]+[A-Za-z0-9]$'
  TailscaleIpPrefixes:
    Type: String
    Default: 100.64.0.0/24
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: t4g.micro
  InstanceName:
    Type: String
    Default: lareferencia-vpn
  HeadscaleVersion:
    Type: String
    Default: 0.29.3
  HeadplaneVersion:
    Type: String
    Default: 0.7.0
  HeadscaleTagOwnerUsername:
    Type: String
    Description: Headscale username allowed to assign tag:lareferencia
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
    ConstraintDescription: Use a Headscale username without @, spaces, or punctuation.
  RetainRootVolume:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  KeepRootVolume: !Equals [!Ref RetainRootVolume, 'true']

Resources:
  HeadscaleSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Headscale HTTPS; administration through SSM
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags: [{Key: Name, Value: lareferencia-headscale}]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: lareferencia-headscale}]

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HeadscaleHostname
      Type: A
      TTL: '60'
      ResourceRecords: [!GetAtt ElasticIp.PublicIp]

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref ExistingWorkloadSubnetId
      SecurityGroupIds: [!Ref HeadscaleSecurityGroup]
      MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            Encrypted: true
            VolumeType: gp3
            VolumeSize: 30
            DeleteOnTermination: !If [KeepRootVolume, false, true]
      Tags:
        - {Key: Name, Value: !Ref InstanceName}
        - {Key: LAReferenciaDeployment, Value: !Ref 'AWS::StackName'}
        - {Key: LAReferenciaRole, Value: headscale}
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee -a /var/log/lareferencia-headscale-bootstrap.log) 2>&1
            export DEBIAN_FRONTEND=noninteractive
            retry() { local n=1; until "$@"; do [ "$n" -ge 30 ] && return 1; n=$((n + 1)); sleep 5; done; }
            retry apt-get update
            retry apt-get install -y ca-certificates curl docker.io docker-compose-v2 snapd
            systemctl enable --now amazon-ssm-agent.service 2>/dev/null || {
              snap install amazon-ssm-agent --classic
              systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service
            }
            retry curl -fsSL --output /tmp/headscale.deb \
              'https://github.com/juanfont/headscale/releases/download/v${HeadscaleVersion}/headscale_${HeadscaleVersion}_linux_arm64.deb'
            retry apt-get install -y /tmp/headscale.deb
            systemctl stop headscale.service || true
            cp /usr/share/doc/headscale/examples/config-example.yaml /etc/headscale/config.yaml
            python3 - <<'PY'
            from pathlib import Path
            from ipaddress import ip_network
            import re
            path = Path('/etc/headscale/config.yaml')
            config = path.read_text()
            prefix = ip_network('${TailscaleIpPrefixes}', strict=True)
            if not prefix.subnet_of(ip_network('100.64.0.0/10')):
                raise RuntimeError('TailscaleIpPrefixes must be inside 100.64.0.0/10')
            changes = (
                (r'^server_url:.*$', 'server_url: https://${HeadscaleHostname}'),
                (r'^listen_addr:.*$', 'listen_addr: 0.0.0.0:443'),
                (r'^tls_letsencrypt_hostname:.*$', 'tls_letsencrypt_hostname: "${HeadscaleHostname}"'),
                (r'^tls_letsencrypt_challenge_type:.*$', 'tls_letsencrypt_challenge_type: TLS-ALPN-01'),
                (r'^  v4:.*$', '  v4: ${TailscaleIpPrefixes}'),
                (r'^  mode: file$', '  mode: database'),
            )
            for pattern, replacement in changes:
                config, count = re.subn(pattern, replacement, config, count=1, flags=re.MULTILINE)
                if count != 1:
                    raise RuntimeError('Headscale config format changed: ' + pattern)
            config, count = re.subn(r'^dns:\n.*?(?=^# Unix socket)', '''dns:
              magic_dns: false
              base_domain: lareferencia.internal
              override_local_dns: false
              nameservers:
                global: []
                split: {}
              search_domains: []
              extra_records: []
            ''', config, count=1, flags=re.MULTILINE | re.DOTALL)
            if count != 1:
                raise RuntimeError('Headscale DNS config format changed')
            path.write_text(config)
            PY
            chown root:headscale /etc/headscale/config.yaml
            chmod 0640 /etc/headscale/config.yaml
            install -d -m 0755 /etc/systemd/system/headscale.service.d
            printf '[Service]\nAmbientCapabilities=CAP_NET_BIND_SERVICE\nCapabilityBoundingSet=CAP_NET_BIND_SERVICE\n' \
              >/etc/systemd/system/headscale.service.d/lareferencia.conf
            headscale configtest
            systemctl daemon-reload
            systemctl enable --now headscale.service docker.service
            headscale health
            headscale users create '${HeadscaleTagOwnerUsername}'
            cat >/run/lareferencia-initial-policy.hujson <<'POLICY'
            {
              "tagOwners": {
                "tag:lareferencia": ["${HeadscaleTagOwnerUsername}@"]
              },
              "grants": [
                {
                  "src": ["tag:lareferencia"],
                  "dst": ["tag:lareferencia"],
                  "ip": ["*"]
                }
              ]
            }
            POLICY
            headscale policy check --file /run/lareferencia-initial-policy.hujson
            headscale --force policy set --file /run/lareferencia-initial-policy.hujson
            rm /run/lareferencia-initial-policy.hujson
            headscale policy get --output json
            install -d -m 0750 /etc/headplane /var/lib/headplane
            cookie_secret="$(openssl rand -hex 16)"
            cat >/etc/headplane/config.yaml <<EOF
            server:
              host: "0.0.0.0"
              port: 3000
              base_url: "http://localhost:3000"
              cookie_secret: "${!cookie_secret}"
              cookie_secure: false
              data_path: "/var/lib/headplane"
            headscale:
              url: "https://${HeadscaleHostname}"
            integration:
              docker: {enabled: false}
              proc: {enabled: false}
            EOF
            chmod 0600 /etc/headplane/config.yaml
            cat >/etc/headplane/compose.yaml <<EOF
            services:
              headplane:
                image: ghcr.io/tale/headplane:${HeadplaneVersion}
                container_name: lareferencia-headplane
                restart: unless-stopped
                ports: ["127.0.0.1:3000:3000"]
                extra_hosts: ["${HeadscaleHostname}:host-gateway"]
                volumes:
                  - /etc/headplane/config.yaml:/etc/headplane/config.yaml:ro
                  - /var/lib/headplane:/var/lib/headplane
                healthcheck:
                  test: ["CMD", "/bin/hp_healthcheck"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
            EOF
            retry docker compose --project-directory /etc/headplane -f /etc/headplane/compose.yaml pull
            docker compose --project-directory /etc/headplane -f /etc/headplane/compose.yaml up -d
            printf 'headscale-bootstrap complete headscale=${HeadscaleVersion} headplane=${HeadplaneVersion} date=%s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/var/lib/headscale-bootstrap-complete

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Host

Outputs:
  VpcId:
    Value: !Ref ExistingVpcId
    Export: {Name: !Sub '${AWS::StackName}-VpcId'}
  WorkloadSubnetId:
    Value: !Ref ExistingWorkloadSubnetId
    Export: {Name: !Sub '${AWS::StackName}-WorkloadSubnetId'}
  WorkloadSubnetCidr:
    Value: !Ref ExistingWorkloadSubnetCidr
    Export: {Name: !Sub '${AWS::StackName}-WorkloadSubnetCidr'}
  HeadscaleUrl:
    Value: !Sub 'https://${HeadscaleHostname}'
    Export: {Name: !Sub '${AWS::StackName}-HeadscaleUrl'}
  HeadscaleInstanceId: {Value: !Ref Host}
  HeadscalePublicIp: {Value: !GetAtt ElasticIp.PublicIp}
  HeadplaneUrl: {Value: 'http://localhost:3000/admin'}
