map $arg_verb $fixture {
    default     "";
    Identify    /Identify.xml;
    ListRecords /ListRecords.xml;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location = /oai {
        if ($fixture = "") { return 400; }
        default_type application/xml;
        try_files $fixture =404;
    }
}
