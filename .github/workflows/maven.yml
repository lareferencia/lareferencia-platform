# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4

    - name: Init workspace modules
      run: ./githelper init

    - name: Reject retired storage references
      run: |
        if rg -n -i "parquet|org\\.apache\\.parquet|repository\\.parquet|parquet-hadoop" \
          --glob '!Docker/data/**' \
          --glob '!**/target/**' \
          --glob '!**/node_modules/**' \
          --glob '!.github/workflows/maven.yml' \
          .; then
          echo "Retired storage references found in source, configuration, or documentation"
          exit 1
        fi
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: ssh setup
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.LMATAS_PRIVATE_KEY }}

    - uses: avides/actions-project-version-check@v1.4.0
      id: version_check 
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        file-to-check: ./pom.xml

    - name: use-version-from-check
      run: echo ${{ steps.version_check.outputs.version }} 

    - name: Test OAI-PMH provider
      run: mvn --batch-mode -pl lareferencia-oai-pmh test
      
    - name: Build with Maven
      run: bash build.sh lareferencia

    - name: Compress Build
      working-directory: .
      run: |
        zip -r lareferencia-platform-${{ steps.version_check.outputs.version  }}.zip . \
          -x "target/*" \
          -x "*/target/*" \
          -x ".git/*" \
          -x "*/.git/*"

    - name: Verify OAI-PMH release artifact
      run: |
        test -s lareferencia-oai-pmh/oai-pmh.jar
        unzip -Z1 lareferencia-platform-${{ steps.version_check.outputs.version }}.zip \
          | grep -Fxq "lareferencia-oai-pmh/oai-pmh.jar"

    - name: Delete existing release if exists
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete ${{ steps.version_check.outputs.version }} --yes --cleanup-tag || true

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version_check.outputs.version }}
        name: Release ${{ steps.version_check.outputs.version }}
        files: ./lareferencia-platform-${{ steps.version_check.outputs.version }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      

  
