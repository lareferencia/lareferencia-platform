name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  release-labels:
    name: Initialize release labels
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create missing release labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/coordinator_release.py labels

  integration:
    name: Locked platform integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: indexing-test
          POSTGRES_DB: indexing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indexing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test workspace tooling
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Reject retired storage references
        run: |
          if rg -n -i 'parquet|org\.apache\.parquet|repository\.parquet|parquet-hadoop' \
            --glob '!docs/**' --glob '!Docker/data/**' --glob '!**/target/**' \
            --glob '!**/node_modules/**' --glob '!.github/workflows/maven.yml' .; then
            echo 'Retired storage references found'
            exit 1
          fi
      - name: Check out locked modules
        run: ./githelper init
      - name: Check inherited Maven and npm versions
        run: ./githelper version sync --check
      - name: Validate coordinator and preview release
        if: github.event_name == 'pull_request'
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if python3 -c 'import json,os,sys; sys.exit(not any(x["name"].startswith("release:") for x in json.loads(os.environ["LABELS_JSON"])))'; then
            ./githelper lock verify --merged
            python3 -c 'import json,os; json.dump({"labels":json.loads(os.environ["LABELS_JSON"])},open("/tmp/coordinator-labels.json","w"))'
            python3 scripts/coordinator_release.py plan /tmp/coordinator-labels.json >> "$GITHUB_STEP_SUMMARY"
          else
            ./githelper lock verify
          fi
      - name: Prepare a fresh source download
        run: |
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/platform-source"
          git -C "$RUNNER_TEMP/platform-source" checkout --detach "$GITHUB_SHA"
          cd "$RUNNER_TEMP/platform-source"
          ./githelper init
          ./githelper version sync --check
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and test freshly downloaded platform
        working-directory: ${{ runner.temp }}/platform-source
        run: |
          mvn --batch-mode --no-transfer-progress clean verify -Plareferencia \
            -Dindexing.test.jdbc-url=jdbc:postgresql://127.0.0.1:5432/indexing_test
      - name: Test administration frontend
        working-directory: ${{ runner.temp }}/platform-source/lareferencia-lrharvester-admin-web
        run: ./node/node node_modules/vitest/vitest.mjs run
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-source/**/target/surefire-reports/**
            ${{ runner.temp }}/platform-source/**/target/failsafe-reports/**
          if-no-files-found: ignore
