name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Initialize release workspace
        run: ./githelper init

      - uses: avides/actions-project-version-check@v1.4.0
        id: version_check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: ./pom.xml

      - name: Build with Maven
        run: ./build.sh lareferencia

      - name: Compress build
        run: |
          zip -r lareferencia-platform-${{ steps.version_check.outputs.version }}.zip . \
            -x "target/*" \
            -x "*/target/*" \
            -x ".git/*" \
            -x "*/.git/*"

      - name: Delete existing release if present
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ steps.version_check.outputs.version }} --yes --cleanup-tag || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.version }}
          name: Release ${{ steps.version_check.outputs.version }}
          files: ./lareferencia-platform-${{ steps.version_check.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
