server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 8080;
    server_name admin.localhost;
    resolver 127.0.0.11 ipv6=off valid=30s;
    # Upstreams must use variables so nginx resolves them per request via the
    # resolver: a static proxy_pass name would fail at startup when the target
    # container is not running yet and would keep a stale IP after recreation.
    set $harvester_upstream http://harvester:8090;
    set $admin_web_upstream http://admin-web-dev:5173;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $admin_web_upstream;
    }

    location ^~ /api/v5/ {
        limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name dashboard.localhost;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $harvester_upstream http://harvester:8090;

    location = / {
        return 302 /dashboard/es/;
    }

    location = /dashboard {
        return 302 /dashboard/es/;
    }

    location ^~ /dashboard/ {
        limit_except GET HEAD { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location = /api/v5/auth/csrf {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location = /api/v5/auth/login {
        limit_except POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location = /api/v5/auth/logout {
        limit_except POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location = /api/v5/me {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location ^~ /api/v5/dashboard/ {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $harvester_upstream;
    }

    location ^~ /api/v5/ {
        return 404;
    }

    location / {
        return 404;
    }
}
